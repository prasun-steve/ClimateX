version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: yourdockerusername/bakkhali-weather-backend:latest
    ports:
      - "5000:5000"
    volumes:
      - ./backend/models:/app/backend/models
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: yourdockerusername/bakkhali-weather-frontend:latest
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:5000
    restart: unless-stopped

  retrainer:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "backend.retrain_scheduler"]
    volumes:
      - ./backend/models:/app/backend/models
    environment:
      - RETRAIN_INTERVAL_HOURS=72
      - TRAIN_START_DATE=2020-01-01
    restart: unless-stopped
